<div class="auth-container">
  <div class="auth-card">
    <h1>CodeRank</h1>
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
        />
        <span class="error" *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
        />
        <span class="error" *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </span>
      </div>

      <button type="submit" [disabled]="!loginForm.valid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <!-- Google Sign-In Button -->
    <div #googleSignInButton class="google-signin-container"></div>

    <p class="signup-link">
      Don't have an account? <a routerLink="/auth/register">Sign up</a>
    </p>
  </div>
</div>
