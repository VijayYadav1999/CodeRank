services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coderank-sql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - coderank-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coderank-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=CodeRankDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      Jwt__Key: development-secret-key-change-me
      Jwt__Expiry: 7d
      Cors__AllowedOrigin: http://localhost:4200
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - coderank-network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.dev
    container_name: coderank-frontend
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - coderank-network
    command: ng serve --host 0.0.0.0 --port 4200 --poll 2000

volumes:
  sqlserver-data:

networks:
  coderank-network:
    driver: bridge
